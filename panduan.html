<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mengunduh Buku Panduan | DompetKu</title>
<meta name="description" content="Mengunduh Buku Panduan Penggunaan Aplikasi DompetKu (PDF).">
<link rel="icon" type="image/png" href="favicon.png">
<meta http-equiv="refresh" content="0; url=assets/panduan/Panduan%20DompetKu.pdf">

<!-- FontAwesome 6 (vendor lokal) -->
<link rel="stylesheet" href="assets/fa/css/all.min.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0f172a;
    color: #f8fafc;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
}

.download-card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 24px;
    padding: 40px 32px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
}

.icon-wrapper {
    width: 84px;
    height: 84px;
    background: rgba(5, 150, 105, 0.15);
    border: 2px solid #059669;
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
    color: #34d399;
    font-size: 36px;
    animation: pulse 2s infinite ease-in-out;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(5, 150, 105, 0.4); }
    50% { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(5, 150, 105, 0); }
}

.title {
    font-size: 22px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -0.3px;
    margin-bottom: 8px;
}

.subtitle {
    font-size: 13px;
    color: #94a3b8;
    line-height: 1.6;
    margin-bottom: 26px;
}

.file-meta-box {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 14px;
    padding: 12px 18px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11.5px;
    color: #94a3b8;
    margin-bottom: 24px;
}
.file-meta-name {
    font-weight: 700;
    color: #ffffff;
    display: flex;
    align-items: center;
    gap: 8px;
}
.file-meta-name i {
    color: #f87171;
    font-size: 14px;
}
.file-meta-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    font-weight: 700;
    color: #34d399;
    background: rgba(5, 150, 105, 0.2);
    padding: 2px 8px;
    border-radius: 6px;
}

.btn-download-direct {
    width: 100%;
    background: #059669;
    color: #ffffff;
    font-weight: 700;
    font-size: 14px;
    padding: 14px 20px;
    border-radius: 14px;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s;
    box-shadow: 0 6px 18px rgba(5, 150, 105, 0.35);
    margin-bottom: 12px;
}
.btn-download-direct:hover {
    background: #047857;
    transform: translateY(-1px);
    box-shadow: 0 8px 22px rgba(5, 150, 105, 0.45);
}

.btn-back {
    color: #94a3b8;
    text-decoration: none;
    font-size: 12px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: color 0.15s;
    padding: 8px 12px;
}
.btn-back:hover {
    color: #ffffff;
}

.footer-text {
    margin-top: 24px;
    font-size: 11px;
    color: #64748b;
    text-align: center;
}
</style>
</head>
<body>

<div class="download-card">
  <div class="icon-wrapper">
    <i class="fa-solid fa-cloud-arrow-down"></i>
  </div>
  
  <h1 class="title">Mengunduh Buku Panduan</h1>
  <p class="subtitle">
    Proses pengunduhan berkas PDF panduan resmi DompetKu (15 Halaman) sedang berjalan otomatis.
  </p>

  <div class="file-meta-box">
    <span class="file-meta-name">
      <i class="fa-solid fa-file-pdf"></i>
      <span>Panduan DompetKu.pdf</span>
    </span>
    <span class="file-meta-badge">15 Halaman A4</span>
  </div>

  <a id="direct-link" href="assets/panduan/Panduan DompetKu.pdf" download="Panduan DompetKu.pdf" class="btn-download-direct">
    <i class="fa-solid fa-download"></i>
    <span>Klik di Sini Jika Belum Mengunduh</span>
  </a>

  <a href="index.html" class="btn-back">
    <i class="fa-solid fa-arrow-left"></i>
    <span>Kembali ke Aplikasi DompetKu</span>
  </a>
</div>

<p class="footer-text">
  &copy; DompetKu · Program Magang Berdampak 2026 UNESA × Rumah BUMN BNI Ngawi
</p>

<script>
window.addEventListener('DOMContentLoaded', function() {
    setTimeout(function() {
        var link = document.createElement('a');
        link.href = 'assets/panduan/Panduan DompetKu.pdf';
        link.download = 'Panduan DompetKu.pdf';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }, 150);
});
</script>

</body>
</html>
