<style>
:root{

  --text:#202124; --muted:#5f6368; --line:#dadce0;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--g50);color:var(--text);font-family:Roboto,"Segoe UI",Arial,Helvetica,sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 48px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:24px;margin-bottom:12px}
.card.head{border-top:10px solid var(--g600);padding-top:22px}
.card.head h1{margin:0 0 6px;font-size:30px;font-weight:400;line-height:1.25}
.card.head p{margin:0;color:var(--muted)}
.card.head .total{margin-top:14px;color:var(--text);font-size:14px}
.card.head .total b{font-size:22px;font-weight:500;color:var(--g700);margin-right:6px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.tabs{display:flex;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
.tabdl{margin:6px 12px 6px auto}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;padding:14px 22px;font:inherit;font-weight:500;color:var(--muted);cursor:pointer}
.tab.on{color:var(--g700);border-bottom-color:var(--g600)}
.qh{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:2px}
.qh h2{margin:0;font-size:16px;font-weight:500;line-height:1.4}
.sub{color:var(--muted);font-size:12px;margin:0 0 20px}
.dl{appearance:none;flex:none;background:#fff;color:var(--g700);border:1px solid var(--g600);border-radius:4px;padding:6px 14px;font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.dl:hover{background:var(--g50)}
.dl.solid{background:var(--g600);color:#fff}
.dl.solid:hover{background:var(--g700)}
.dl:disabled{opacity:.6;cursor:wait}
.chart{display:grid;grid-template-columns:44px 1fr;margin-top:34px}
.yaxis{position:relative;height:240px}
.yaxis span{position:absolute;right:8px;transform:translateY(50%);font-size:11px;color:var(--muted)}
.plot{position:relative;height:240px;border-left:1px solid #9aa0a6;border-bottom:1px solid #9aa0a6}
.grid{position:absolute;left:0;right:0;border-top:1px solid #e8eaed}
.col{position:absolute;top:0;bottom:0}
.bar{position:absolute;left:18%;right:18%;bottom:0;border-radius:3px 3px 0 0}
.vl{position:absolute;left:-10px;right:-10px;text-align:center;font-size:12px;line-height:1.25;color:var(--text)}
.vl b{display:block;font-weight:500;font-size:13px}
.vl i{display:block;font-style:normal;color:var(--muted);font-size:11px}
.xlabels{display:grid;margin-left:44px;margin-top:8px}
.xl{text-align:center;font-size:12px;line-height:1.3;padding:0 6px;word-break:break-word}
.axisnote{margin:14px 0 0 44px;font-size:11px;color:var(--muted)}
.sdesc{margin:0 0 18px;padding:12px 14px;background:var(--g50);border-radius:6px;font-size:13px;color:var(--g900)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sbox{background:#fff;border:1px solid var(--g100);border-top:4px solid var(--g600);border-radius:6px;padding:0;display:flex;flex-direction:column;overflow:hidden}
.sbox .o{padding:12px 16px;background:var(--g50);font-size:14px;font-weight:500;color:var(--g900);border-bottom:1px solid var(--g100)}
.sbox .o span{font-weight:400;color:var(--g700)}
.sbox .t{padding:16px;font-size:14.5px;line-height:1.6;word-break:break-word;flex:1}
.wrap.wide{max-width:1400px}
.ptools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.pnote{color:var(--muted);font-size:12px;margin:0 0 14px}
.pscroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:#ecfdf5}
#poster svg{display:block;width:100%;min-width:820px;height:auto}
.hide{display:none}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--g700);color:#fff;font-weight:500;text-align:left;padding:10px 12px;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:var(--g25)}
td.n,th.n{width:44px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#202124;color:#fff;padding:10px 16px;border-radius:6px;font-size:13px;max-width:90%;z-index:50;display:none}
@media(max-width:640px){
  .sgrid{grid-template-columns:1fr}
  .tabdl{margin:0 12px 10px;width:calc(100% - 24px)}
  .card.head h1{font-size:24px}
  .chart{grid-template-columns:36px 1fr}
  .xlabels{margin-left:36px}
  .axisnote{margin-left:36px}
}
</style>
</head>

const PALETTE = ['#059669','#0ea5e9','#f59e0b','#8b5cf6','#ef4444','#14b8a6','#ec4899','#84cc16'];
const PLOT_H = 240;
const TRIVIAL = ['tidak','tidak ada','belum ada'];
const PREFIX = 'Kuesioner-UMKM-Rumah-BUMN-BNI-Ngawi';
const fmt = n => n.toLocaleString('id-ID',{minimumFractionDigits:1,maximumFractionDigits:1});
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = s => String(s).replace(/[^\p{L}\p{N}\s-]/gu,'').trim().replace(/\s+/g,'-');
const pad2 = n => String(n).padStart(2,'0');
const saranList = () => DATA.filter(r=>r.saran && !TRIVIAL.includes(r.saran.trim().toLowerCase()));

/* Nama file informatif */
function qFile(i,ext){
  const q = QUESTIONS[i];
  const info = q.type==='text' ? saranList().length+'-saran-dari-'+DATA.length+'-responden' : tally(q).n+'-dari-'+DATA.length+'-responden';
  return `${PREFIX}_Pertanyaan-${pad2(i+1)}_${slug(q.title)}_${info}.${ext}`;
}
const FILES = {
  head:   `${PREFIX}_Judul-dan-Total-${DATA.length}-Responden.png`,
  table:  `${PREFIX}_Daftar-${DATA.length}-Responden-Tabel.png`,
  poster: `${PREFIX}_Grafik-Keseluruhan-Semua-Pertanyaan-${DATA.length}-Responden`,
  ringkasan: `${PREFIX}_Ringkasan-Semua-Pertanyaan-Tampilan-Halaman-${DATA.length}-Responden.png`,
  csv:    `${PREFIX}_Seluruh-Data-${DATA.length}-Responden.csv`,
  zip:    `${PREFIX}_Semua-Gambar-Grafik-${DATA.length}-Responden.zip`
};

function tally(q){
  const m = new Map(); let n = 0;
  DATA.forEach(r=>{
    const v = r[q.key];
    const list = q.type==='multi' ? v : (v ? [v] : []);
    if(list.length){ n++; list.forEach(x=>m.set(x,(m.get(x)||0)+1)); }
  });
  const items = [...m.entries()].map(([label,c])=>({label,c}));
  items.sort((a,b)=>{
    if(q.order){
      const ia=q.order.indexOf(a.label), ib=q.order.indexOf(b.label);
      if(ia!==-1 || ib!==-1) return (ia===-1?99:ia)-(ib===-1?99:ib);
    }
    return b.c-a.c || a.label.localeCompare(b.label);
  });
  return {items,n};
}

function chartHTML(items,n){
  const k = items.length;
  let h = '<div class="chart"><div class="yaxis">';
  [0,25,50,75,100].forEach(t=>{ h += `<span style="bottom:${t/100*PLOT_H}px">${t}%</span>`; });
  h += '</div><div class="plot">';
  [25,50,75,100].forEach(t=>{ h += `<div class="grid" style="bottom:${t/100*PLOT_H}px"></div>`; });
  items.forEach((it,i)=>{
    const pct = it.c/n*100, bh = pct/100*PLOT_H;
    h += `<div class="col" style="left:${i/k*100}%;width:${100/k}%">
      <div class="vl" style="bottom:${bh+5}px"><b>${it.c}</b><i>${fmt(pct)}%</i></div>
      <div class="bar" style="height:${bh}px;background:${PALETTE[i % PALETTE.length]}"></div></div>`;
  });
  h += '</div></div>';
  h += `<div class="xlabels" style="grid-template-columns:repeat(${k},1fr)">` + items.map(it=>`<div class="xl">${esc(it.label)}</div>`).join('') + '</div>';
  return h;
}

function build(){
  document.getElementById('total').textContent = DATA.length;
  let html = '';
  QUESTIONS.forEach((q,i)=>{
    let body='', sub='';
    if(q.type==='text'){
      const t = saranList();
      sub = `${t.length} jawaban dari ${DATA.length} responden`;
      body = '<div class="sdesc">Saran dan masukan dari Kuesioner Pemetaan Kebutuhan Pencatatan Keuangan UMKM binaan Rumah BUMN BNI Ngawi, terkait aplikasi pencatatan keuangan yang dibutuhkan pelaku usaha.</div>'
           + '<div class="sgrid">'+t.map(r=>`<div class="sbox"><div class="o"><span>Pemilik</span> ${esc(r.nama)}</div><div class="t">&ldquo;${esc(r.saran)}&rdquo;</div></div>`).join('')+'</div>';
    }else{
      const t = tally(q);
      sub = `${t.n} jawaban` + (q.type==='multi' ? '. Pilihan ganda, persentase dihitung dari jumlah responden.' : '');
      body = chartHTML(t.items,t.n) + '<div class="axisnote">Tinggi batang menunjukkan persentase responden. Angka di atas batang: jumlah responden dan persentase.</div>';
    }
    html += `<div class="card" id="q${i+1}"><div class="qh"><h2>${esc(q.title)}</h2>
      <button class="dl" data-q="${i}">Unduh gambar</button></div><p class="sub">${sub}</p>${body}</div>`;
  });
  document.getElementById('ringkasan').innerHTML = html;
  const cols=[['nama','Nama usaha'],['jenis','Jenis usaha'],['lama','Lama usaha'],['omzet','Omzet per bulan'],['catat','Mencatat keuangan'],['cara','Cara mencatat']];
  document.getElementById('tbl').innerHTML =
    '<thead><tr><th class="n">No</th>'+cols.map(c=>`<th>${c[1]}</th>`).join('')+'</tr></thead><tbody>'+
    DATA.map((r,i)=>`<tr><td class="n">${i+1}</td>`+cols.map(c=>`<td>${esc(r[c[0]]||'-')}</td>`).join('')+'</tr>').join('')+'</tbody>';
  document.getElementById('tabel-sub').textContent = DATA.length+' responden';
}

function showTab(id){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===id));
  ['ringkasan','grafik','responden'].forEach(t=>document.getElementById(t).classList.toggle('hide',t!==id));
  document.getElementById('wrap').classList.toggle('wide',id==='grafik');
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));

/* ===== Penyimpanan file ===== */
let toastT;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; clearTimeout(toastT); toastT=setTimeout(()=>t.style.display='none',4000); }
let DL = null;
const dlReady = (async()=>{
  try{ DL = (window.claude && claude.use) ? await claude.use('downloads') : null; }catch(e){ DL = null; }
})();
async function save(name,data){
  await dlReady;
  const blob = data instanceof Blob ? data : new Blob([data],{type:'text/plain;charset=utf-8'});
  if(DL){
    try{ await DL.save({filename:name,data:blob}); toast('Tersimpan: '+name); }
    catch(err){ if(err && err.code==='declined') return; toast('Gagal menyimpan: '+((err&&err.message)||'tidak diketahui')); }
    return;
  }
  /* cadangan bila dibuka di luar claude.ai */
  try{
    const u = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);
  }catch(e){ toast('Unduhan tidak tersedia di tampilan ini. Buka artifact di claude.ai.'); }
}
async function withBusy(btn,label,fn){
  const old = btn.textContent; btn.disabled = true; if(label) btn.textContent = label;
  try{ await fn(); }catch(err){ toast('Gagal: '+((err&&err.message)||err)); }
  btn.textContent = old; btn.disabled = false;
}

/* ===== Gambar SVG (vektor) ===== */
const PF = "Roboto,'Segoe UI',Arial,Helvetica,sans-serif";
const XMLDECL = '<?xml version="1.0" encoding="UTF-8"?>\n';
const mctx = document.createElement('canvas').getContext('2d');
function tw(s,size,weight){ mctx.font = `${weight||400} ${size}px ${PF}`; return mctx.measureText(s).width * 1.02; }
function wrapText(s,size,weight,maxW){
  const words = String(s).split(/\s+/).filter(Boolean), lines = []; let cur = '';
  words.forEach(w=>{
    const t = cur ? cur+' '+w : w;
    if(!cur || tw(t,size,weight) <= maxW){ cur = t; } else { lines.push(cur); cur = w; }
  });
  if(cur) lines.push(cur);
  return lines.length ? lines : [''];
}
const T = (x,y,txt,o={}) => `<text x="${x}" y="${y}" font-size="${o.s||16}" font-weight="${o.w||400}" fill="${o.f||'#202124'}"${o.a?` text-anchor="${o.a}"`:''}>${esc(txt)}</text>`;
const IN = 20;

function wrapChars(s,size,weight,maxW){
  const out = [];
  wrapText(s,size,weight,maxW).forEach(line=>{
    if(tw(line,size,weight) <= maxW){ out.push(line); return; }
    let cur = '';
    [...line].forEach(ch=>{ if(cur && tw(cur+ch,size,weight) > maxW){ out.push(cur); cur = ch; } else cur += ch; });
    if(cur) out.push(cur);
  });
  return out;
}

/* grafik batang vertikal */
function chartCard(q,i,colW){
  const N = DATA.length, t = tally(q), color = PALETTE[i % PALETTE.length], barW = colW - 2*IN;
  const tLines = wrapText(q.title,18,500,barW-32);
  const sub = `${t.n} dari ${N} responden` + (q.type==='multi' ? ' (pilihan ganda, % dari responden)' : '');
  const sLines = wrapText(sub,12.5,400,barW);
  let s = '', y = 30;
  s += `<circle cx="${IN+11}" cy="${y-6}" r="11" fill="${color}"/>` + T(IN+11,y-1.5,i+1,{s:12,w:700,f:'#ffffff',a:'middle'});
  tLines.forEach((l,k)=>{ s += T(IN+32,y+k*23,l,{s:18,w:500}); });
  y += (tLines.length-1)*23 + 20;
  sLines.forEach((l,k)=>{ s += T(IN,y+k*16,l,{s:12.5,f:'#5f6368'}); });
  y += (sLines.length-1)*16 + 14;

  const k = t.items.length, axisW = 38, plotH = 190, topPad = 38;
  const px = IN + axisW, pw = barW - axisW, cw = pw / k;
  const py = y + topPad, base = py + plotH;
  [0,25,50,75,100].forEach(v=>{
    const gy = base - v/100*plotH;
    s += `<line x1="${px}" y1="${gy}" x2="${px+pw}" y2="${gy}" stroke="${v===0?'#9aa0a6':'#e8eaed'}" stroke-width="1"/>`;
    s += T(px-6,gy+4,v+'%',{s:11,f:'#5f6368',a:'end'});
  });
  s += `<line x1="${px}" y1="${py}" x2="${px}" y2="${base}" stroke="#9aa0a6" stroke-width="1"/>`;
  const lfs = k>5 ? 10.5 : (k>3 ? 11.5 : 12.5), lh = lfs + 3.5;
  let maxLines = 1;
  t.items.forEach((it,j)=>{
    const pct = it.c / t.n * 100, bh = Math.max(pct/100*plotH, 2);
    const bw = Math.min(cw*0.62, 72), cx = px + cw*j + cw/2;
    s += `<rect x="${cx-bw/2}" y="${base-bh}" width="${bw}" height="${bh}" rx="3" fill="${PALETTE[j % PALETTE.length]}"/>`;
    s += T(cx,base-bh-18,it.c,{s:13,w:700,a:'middle'});
    s += T(cx,base-bh-5,fmt(pct)+'%',{s:11,f:'#5f6368',a:'middle'});
    const ll = wrapChars(it.label,lfs,400,cw-6);
    maxLines = Math.max(maxLines,ll.length);
    ll.forEach((l,m)=>{ s += T(cx,base+16+m*lh,l,{s:lfs,a:'middle'}); });
  });
  const h = base + 16 + (maxLines-1)*lh + 18;
  return {h, svg:`<rect width="${colW}" height="${h}" rx="12" fill="#ffffff" stroke="#cfe3d8" stroke-width="1.2"/>` + s};
}

function saranCards(num,colW){
  const N = DATA.length, saran = saranList(), out = [];
  out.push({h:62, svg:`<rect width="${colW}" height="62" rx="12" fill="#047857"/>`
    + `<circle cx="${IN+11}" cy="24" r="11" fill="#ffffff"/>` + T(IN+11,28.5,num,{s:12,w:700,f:'#047857',a:'middle'})
    + T(IN+32,30,'Saran dan masukan',{s:18,w:500,f:'#ffffff'})
    + T(IN,50,`${saran.length} jawaban dari ${N} responden`,{s:12.5,f:'#d1fae5'})});
  saran.forEach(r=>{
    const lines = wrapText('\u201c'+r.saran.trim()+'\u201d',14.5,400,colW-2*IN);
    const h = 52 + (lines.length-1)*20 + 16;
    let s = `<rect width="${colW}" height="${h}" rx="10" fill="#ffffff" stroke="#cfe3d8" stroke-width="1.2"/>`;
    s += `<rect width="4" height="${h-20}" x="0" y="10" fill="#059669"/>`;
    s += T(IN,28,r.nama,{s:13.5,w:700,f:'#047857'});
    lines.forEach((l,k)=>{ s += T(IN,52+k*20,l,{s:14.5}); });
    out.push({h, svg:s});
  });
  return out;
}

/* satu pertanyaan jadi satu gambar */
function questionSvg(i){
  const q = QUESTIONS[i], W = 680, M = 24, G = 12;
  let cards = q.type==='text' ? saranCards(i+1,W) : [chartCard(q,i,W)];
  let y = M, g = '';
  cards.forEach(c=>{ g += `<g transform="translate(${M},${y})">${c.svg}</g>`; y += c.h + G; });
  const H = y - G + M, TW = W + 2*M;
  return {W:TW,H,svg:`<svg xmlns="http://www.w3.org/2000/svg" width="${TW}" height="${H}" viewBox="0 0 ${TW} ${H}" font-family="${PF}"><rect width="${TW}" height="${H}" fill="#ecfdf5"/>${g}</svg>`};
}

function scaleFor(w,h){
  const mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  const maxArea = mobile ? 16e6 : 100e6;
  return Math.max(1, Math.min(4, Math.sqrt(maxArea/(w*h)), 30000/h));
}
async function svgToPng({svg,W,H}){
  const s = scaleFor(W,H);
  const url = URL.createObjectURL(new Blob([XMLDECL+svg],{type:'image/svg+xml;charset=utf-8'}));
  try{
    const img = new Image();
    await new Promise((ok,no)=>{ img.onload = ok; img.onerror = ()=>no(new Error('Gambar SVG gagal dimuat')); img.src = url; });
    const c = document.createElement('canvas'); c.width = Math.round(W*s); c.height = Math.round(H*s);
    const x = c.getContext('2d'); x.fillStyle = '#ecfdf5'; x.fillRect(0,0,c.width,c.height);
    x.imageSmoothingQuality = 'high'; x.drawImage(img,0,0,c.width,c.height);
    return await new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error('Ukuran gambar terlalu besar. Gunakan unduhan SVG.')),'image/png'));
  } finally { URL.revokeObjectURL(url); }
}

/* ===== Poster (semua pertanyaan) ===== */
let POSTER = null;
function buildPoster(){
  const W = 1500, PAD = 36, GAP = 18, COLS = 3, N = DATA.length;
  const colW = (W - 2*PAD - (COLS-1)*GAP) / COLS;
  const tl = wrapText('Hasil Kuesioner Pemetaan Kebutuhan Aplikasi Pencatatan Keuangan UMKM Binaan Rumah BUMN BNI Ngawi',32,700,W-2*PAD);
  let hy = 52, head = '';
  tl.forEach((l,k)=>{ head += T(PAD,hy+k*40,l,{s:32,w:700,f:'#ffffff'}); });
  hy += (tl.length-1)*40 + 32;
  head += T(PAD,hy,`Ringkasan seluruh pertanyaan dari ${N} responden`,{s:17,f:'#d1fae5'});
  const headH = hy + 26;
  const top = headH + 22, colY = Array(COLS).fill(top), colX = [...Array(COLS)].map((_,k)=>PAD + k*(colW+GAP));
  let body = '';
  const place = c => {
    let k = 0; for(let j=1;j<COLS;j++) if(colY[j] < colY[k]-0.5) k = j;
    body += `<g transform="translate(${colX[k]},${colY[k]})">${c.svg}</g>`;
    colY[k] += c.h + GAP;
  };
  let last = 0;
  QUESTIONS.forEach((q,i)=>{ if(q.type!=='text'){ place(chartCard(q,i,colW)); last = i+1; } });
  saranCards(last+1,colW).forEach(place);
  const H = Math.max(...colY) - GAP + 14;
  const foot = T(W/2,H+16,`Sumber: respons kuesioner. Total ${N} responden.`,{s:12.5,f:'#5f6368',a:'middle'});
  const HH = H + 30;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${HH}" viewBox="0 0 ${W} ${HH}" font-family="${PF}">`
    + `<defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#064e3b"/><stop offset="1" stop-color="#059669"/></linearGradient></defs>`
    + `<rect width="${W}" height="${HH}" fill="#ecfdf5"/><rect width="${W}" height="${headH}" fill="url(#hg)"/>` + head + body + foot + `</svg>`;
  return {svg, W, H:HH};
}
function initPoster(){
  POSTER = buildPoster();
  document.getElementById('poster').innerHTML = POSTER.svg;
  const s = scaleFor(POSTER.W,POSTER.H);
  document.getElementById('poster-info').textContent = `Ukuran PNG: ${Math.round(POSTER.W*s)} x ${Math.round(POSTER.H*s)} piksel. SVG tidak punya batas resolusi.`;
}

/* ===== html2canvas (judul, tabel, tampilan ringkasan) ===== */
async function shot(el,scale,bg){
  if(typeof html2canvas==='undefined') throw new Error('Library gambar belum termuat. Periksa koneksi lalu muat ulang.');
  const hidden = el.closest('.hide'); if(hidden) hidden.classList.remove('hide');
  try{
    const c = await html2canvas(el,{scale:scale||3,backgroundColor:bg||'#ffffff',useCORS:true,ignoreElements:n=>n.classList && n.classList.contains('dl')});
    return await new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error('Ukuran gambar terlalu besar untuk perangkat ini')),'image/png'));
  } finally { if(hidden) hidden.classList.add('hide'); }
}

/* ===== Tombol ===== */
document.addEventListener('click',e=>{
  const btn = e.target.closest('.dl[data-q]'); if(!btn) return;
  const i = +btn.dataset.q;
  withBusy(btn,'Memproses...',async()=>{ await save(qFile(i,'png'), await svgToPng(questionSvg(i))); });
});
document.getElementById('btn-head').addEventListener('click',e=>withBusy(e.currentTarget,'Memproses...',async()=>{
  await save(FILES.head, await shot(document.getElementById('card-head'),3)); }));
document.getElementById('btn-table').addEventListener('click',e=>withBusy(e.currentTarget,'Memproses...',async()=>{
  await save(FILES.table, await shot(document.getElementById('card-tabel'),2)); }));

document.getElementById('btn-zip').addEventListener('click',e=>{
  const btn = e.currentTarget;
  withBusy(btn,'Menyiapkan...',async()=>{
    if(typeof JSZip==='undefined') throw new Error('Library ZIP belum termuat. Periksa koneksi lalu muat ulang.');
    const zip = new JSZip();
    for(let i=0;i<QUESTIONS.length;i++){
      btn.textContent = `Memproses ${i+1} dari ${QUESTIONS.length}`;
      zip.file(qFile(i,'png'), await svgToPng(questionSvg(i)));
    }
    btn.textContent = 'Menambah grafik keseluruhan';
    zip.file(FILES.poster+'.png', await svgToPng(POSTER));
    try{ btn.textContent = 'Menambah judul'; zip.file(FILES.head, await shot(document.getElementById('card-head'),3)); }catch(_){}
    btn.textContent = 'Menyusun ZIP';
    await save(FILES.zip, await zip.generateAsync({type:'blob'}));
  });
});

document.getElementById('btn-csv').addEventListener('click',()=>{
  const cols = [
    ['id','ID'],['nama','Nama usaha'],['jenis','Jenis usaha'],['jenis_lain','Jenis usaha (lainnya)'],['lama','Lama usaha'],['omzet','Omzet per bulan'],
    ['catat','Mencatat keuangan'],['cara','Cara mencatat'],['media','Media digital'],['media_lain','Media digital (lainnya)'],
    ['kendala','Kendala'],['kendala_lain','Kendala (lainnya)'],['campur','Uang bercampur'],['habis','Keuntungan habis'],
    ['pernah','Pengalaman aplikasi'],['apps','Aplikasi digunakan'],['apps_lain','Aplikasi (lainnya)'],['sering','Platform sering digunakan'],
    ['ai','Ketertarikan AI'],['ingin','Platform diinginkan'],['bantu','Manfaat bagi usaha'],['bersedia','Kesediaan menggunakan'],
    ['bayar','Model pembayaran'],['alasan','Alasan bayar sekali'],['saran','Saran'],['waktu','Waktu pengisian']
  ];
  const cell = v => { const s = Array.isArray(v) ? v.join('; ') : (v==null?'':String(v)); return '"'+s.replace(/"/g,'""')+'"'; };
  const csv = '\ufeff'+[cols.map(c=>cell(c[1])).join(',')].concat(DATA.map(r=>cols.map(c=>cell(r[c[0]])).join(','))).join('\r\n');
  save(FILES.csv, new Blob([csv],{type:'text/csv;charset=utf-8'}));
});

document.getElementById('btn-poster-png').addEventListener('click',e=>withBusy(e.currentTarget,'Memproses gambar',async()=>{
  await save(FILES.poster+'.png', await svgToPng(POSTER)); }));
document.getElementById('btn-poster-svg').addEventListener('click',e=>withBusy(e.currentTarget,null,async()=>{
  await save(FILES.poster+'.svg', new Blob([XMLDECL+POSTER.svg],{type:'image/svg+xml'})); }));

document.getElementById('btn-tab-png').addEventListener('click',e=>{
  const tab = (document.querySelector('.tab.on')||{dataset:{tab:'ringkasan'}}).dataset.tab;
  withBusy(e.currentTarget,'Memproses gambar',async()=>{
    if(tab==='grafik') return save(FILES.poster+'.png', await svgToPng(POSTER));
    const el = document.getElementById(tab==='ringkasan' ? 'ringkasan' : 'card-tabel');
    const sc = Math.max(1, Math.min(3, 14000/el.offsetHeight));
    await save(tab==='ringkasan' ? FILES.ringkasan : FILES.table, await shot(el,sc,tab==='ringkasan' ? '#ecfdf5' : '#ffffff'));
  });
});

build();
initPoster();
</script>
